[package]
name = "transaction-cache"
version = "0.1.0"
edition = "2024"

[dependencies]
borsh = "1.7"
futures = "0.3.31"
log = "0.4.32"
serde = "1.0.228"
serde_json = "1.0.150"
solana-client = "4.2.2"
solana-sdk = "4.0.0"
solana-transaction-status-client-types = { version = "4.2.2", features = ["agave-unstable-api"] }

tokio = "1.53"
anyhow = "1.0.100"
sled = "0.34"

solana-tx-parser = { git = "https://github.com/miaomiaowu0428/solana-tx-parser.git", branch = "main" }
utils = { git = "https://github.com/miaomiaowu0428/sol-utils.git", branch = "main" }
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }


[dev-dependencies]
env_logger = "0.11.8"
dotenvy = "0.15.7"
